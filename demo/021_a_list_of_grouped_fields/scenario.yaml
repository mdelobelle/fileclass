# Narration for take 021 — see ../SCENARIO.md for the format.
# Seventh of arc 4 (022 closes it). Starts where 020 ended: Comic carries its `storage`
# group, the three albums are stored in it, and Comics.base sorts them by room and level.
# Adds `Book.editions` — several groups of the same shape under one property, which is
# what ObjectList is for — and its display template.
#
# Facts the script leans on, all measured in the app before scripting:
#  - an item is edited with the same editor a group uses, so nothing new has to be
#    explained at step 5; the list adds the rank, the reorder and the removal;
#  - a new item exists only once its editor is saved. Until this take's surfaces pass,
#    *Add item* pushed an empty item before opening the editor and cancelling left it
#    behind — invisible in the list, silent in the *Unsaved changes* line, and written
#    as `{}` on the next save. Fixed here, which is also why step 9 can say Remove
#    without a caveat;
#  - an item with nothing in it now displays as (empty) rather than as the template's
#    leftover `·`, from the same pass;
#  - a child may carry the same name as a root field, which step 4 relies on: Book has a
#    `publisher`, and each edition has its own. Until this was fixed the child was
#    dropped from the resolved schema and never offered when adding an item — reported
#    from a real vault, and it would have happened on camera at step 5;
#  - what Bases does with a list of groups, measured over three books:
#      note.editions.length      → 3 · 2 · empty where the key is absent
#      note.editions[0].year     → indexing works, and reaches a child
#      note.editions.map(...)    → an EMPTY cell, not an error: no arrow functions
#    So steps 11 and 12 count and reach the first item, and the take never promises a
#    column listing every format. Books.base ships those two formulas in a second view,
#    so nothing films formula editing (#19).
#
# The editions to type, and how honest each one is:
#   Dune                    Hardcover · 1965 · Chilton Books   ← the real first edition
#                           Paperback · 1990 · Ace Books       ← this library's own copy
#                           Ebook · 2011 · Ace Books           ← typed, then removed at
#                                                                step 9
#   The Lord of the Rings   Paperback · 1991                   ← the copy its own note
#                                                                describes, publisher
#                                                                left empty
#
# The counts are what make step 11 say something, so they are load-bearing: Dune goes to
# three and comes back to **two**, which is what gives Remove an honest victim instead of
# a step that only names it. Tolkien gets **one** — the most faithful reading of its own
# prose, "Allen & Unwin brought it out in three volumes from 1954" being a fact about the
# work while "Mine is the 1991 paperback set, spines long gone" is the copy on the shelf.
# Its publisher is deliberately left empty, because the note doesn't name one and the take
# invents nothing; that also puts a partially filled item on screen, which is the honest
# state of most real libraries.
#
# What the FirstYear column will read on camera, given the reordering at step 9: 1990 for
# Dune (the paperback is first now, not the 1965 hardcover), 1991 for Tolkien, nothing for
# Atomic Habits. Step 12 says "whichever you moved there" for exactly that reason — the
# column follows the order the operator chose two steps earlier, which is the point.
#
# Atomic Habits keeps no editions at all: at step 11 its count cell is simply empty,
# which is what a base does with a note that hasn't got the property — better shown
# than claimed, and measured: an empty count sorts last under DESC.
#
# The vault opens on Dune, whose single publisher and single year step 1 reads.
title: "Fileclass — A list of grouped fields"
description: "Several editions of one book, typed as a list of groups."
doc: "fields/#nested-fields-object--objectlist" # deep link used in the description
tags: "objectlist, nested properties, display template, bases"
vault_name: "Demo"
plugin: true
settings:
  classFilesPath: "Classes/"
  fileClassAlias: "fileClass"
initial_pause: 1500
default_pause: 900

steps:
  - title: "Dune names one publisher and one year — but the book has been through several editions"
    pause: 2100
  - title: "Several groups of the same shape under one property: that is what an ObjectList holds"
    pause: 2100
  - title: "Give Book a field called editions, of type ObjectList"
    pause: 1900
  - title: "Its children are declared as a group's are: format from a list, year as a number, and publisher"
    values: "Hardcover | Paperback | Ebook"
    pause: 2200
  - title: "The first item, the 1965 hardcover: filled with the very editor a group uses"
    values: "Hardcover · 1965 · Chilton Books"
    pause: 2300
  - title: "Two more: the paperback on the shelf today, and an ebook — and each item carries its rank"
    values: "Paperback · 1990 · Ace Books | Ebook · 2011 · Ace Books"
    pause: 2200
  - title: "Saved, the frontmatter holds a real list of groups, and not one line of YAML typed"
    pause: 2100
  - title: "A display template brings each item back to one line: format, middle dot, year"
    values: "{{format}} · {{year}}"
    pause: 2200
  - title: "The order is yours, and so is what leaves: the paperback moves up, the ebook goes away"
    pause: 2300
  - title: "The Lord of the Rings gets the copy its note describes: the 1991 paperback, publisher unknown"
    values: "Paperback · 1991"
    pause: 2400
  - title: "And a base counts them, most first: two for Dune, one for Tolkien, none yet for the third"
    pause: 2400
  - title: "It even reaches into the first item — whichever you moved there — for its year: data, not a paragraph"
    pause: 2400
