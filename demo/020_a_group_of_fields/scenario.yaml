# Narration for take 020 — see ../SCENARIO.md for the format.
# Sixth of arc 4 (021 and 022 still follow). Starts where 019 ended: the four
# activities carry their coordinates and Activities.base has its map view. Turns
# `Book.shelf` — the templated string take 016 built — into `storage`, a group of
# groups. Nested properties, which is the thing the community asks for most often and
# what the Object type answers.
#
# Why storage and not the publisher this take first used: an Object is for a value
# with no identity of its own. A publisher has one — it deserves a note, backlinks, a
# base — so using it as a group teaches the wrong criterion, and an attentive viewer
# would ask why it isn't a class. A shelf location exists only as an attribute of the
# book, which is exactly what the type is for.
#
# Facts the script leans on, all measured in the app before scripting:
#  - the old value `Study · A-3` does not fit the new shape, and is shown, flagged
#    ("must be a group of properties") and kept when an empty group is saved. Before
#    this take's surfaces pass it was invisible, unflagged, and overwritten with `{}`;
#  - a group's children are reachable from the field's own settings, so steps 4 to 7
#    never leave the modal — that too came out of this take's pass;
#  - a token naming a child group defers to THAT group's template: `{{room}} ·
#    {{shelf}}` over `{{unit}}-{{level}}` rebuilds the very string take 016 produced.
#    There is deliberately no path syntax like `{{shelf.level}}` — one mechanism is
#    easier to explain and to maintain, and composition already covers the need;
#  - with a template set, that summary also replaces the raw JSON in Obsidian's own
#    Properties panel, and a valid group loses the warning colour Obsidian paints on a
#    value it can't interpret;
#  - Bases does NOT resolve a dotted nested path, in a column or in a sort:
#    `storage.room` and `note.storage.room` both leave the order untouched. A one-line
#    formula does — sorting on `formula.Room` gives Attic, Living room, Study. Books.base
#    ships those formulas, so step 12 shows a result rather than filming YAML (#19).
#
# The vault opens on Dune, the book the take works on.
#
# Activities.base keeps the map view take 019 built. It needs the Maps community
# plugin, which a staged vault doesn't ship, so it renders as an unknown view type
# until someone installs it — the same shape of problem `fileclass-table` had. No take
# opens that base.
title: "Fileclass — A group of fields inside a field"
description: "Nested properties, typed and filled without writing YAML."
doc: "fields/#nested-fields-object--objectlist" # deep link used in the description
tags: "object, nested properties, frontmatter, groups"
vault_name: "Demo"
plugin: true
settings:
  classFilesPath: "Classes/"
  fileClassAlias: "fileClass"
initial_pause: 1500
default_pause: 900

steps:
  - title: "Since take 016 the shelf is a well-formed string: Study, middle dot, A dash 3"
    pause: 2000
  - title: "But the room, the unit and the level are only text in there — nothing to sort, nothing to filter"
    pause: 2100
  - title: "Obsidian's properties are flat: nested properties are what people ask for most"
    pause: 2000
  - title: "Change shelf's type to Object, and rename it storage"
    pause: 1900
  - title: "The old value doesn't fit that shape: it is shown, flagged, and not thrown away"
    pause: 2000
  - title: "Declare what the group holds: room, from a list of values — and shelf"
    pause: 2000
  - title: "And shelf is a group in its turn: unit, and level as a number"
    pause: 1900
  - title: "Fill it: room offers what you allowed, level refuses anything that isn't a number"
    pause: 2000
  - title: "Saved, the frontmatter holds two real levels"
    pause: 1800
  - title: "A template on each group: unit dash level, then room, middle dot, shelf"
    pause: 2000
  - title: "The display comes back to the string we started from — same text, structure underneath"
    pause: 2100
  - title: "And a base sorts by room, then by level: what no string could ever do"
    pause: 2200
