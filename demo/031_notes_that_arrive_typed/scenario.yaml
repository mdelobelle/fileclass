# Narration for take 031 — see ../SCENARIO.md for the format.
# Closes arc 6. Every take so far typed a note *after* it was written — by hand, from a menu,
# in bulk. This one types it before: the class goes into a template, and new notes arrive with
# their fields already there.
#
# The vault opens on **Templates/New book.md**, a template carrying **nothing but two headings**
# — no frontmatter at all. Steps 2 and 3 give it a class and fill it on camera, and steps 7 to 9
# do the same for the daily template, which is also shipped classless: the point of this take is
# the gesture, so nothing it demonstrates is pre-baked.
#
# The fixture is take 030c's vault at its closing state — Book carries `lent to`, and its seven
# notes carry the whole class, empty where nothing was filled in — plus a `Templates/` folder
# holding *New book* and *Daily note*.
#
# Facts the script leans on, all measured in the app before scripting:
#  - the **Templates** core plugin is enabled with **no folder configured** (`{}`), which is what
#    step 4 sets on camera; its commands are `Templates: Insert template`, `Insert current date`,
#    `Insert current time`;
#  - `.obsidian/daily-notes.json` already points at `Templates/Daily note` (folder `Daily`,
#    format `YYYY/MM/YYYY-MM-DD`): which template a daily note uses is a setting, not a lesson,
#    so it is shipped rather than filmed;
#  - *Insert missing fields* on a template writes the class's fields into **that note**, like any
#    other: a template is a note, which is the whole trick. Measured: writing `fileClass: Book`
#    into *New book* and running it takes the template from no frontmatter to **18 keys**
#    (`inserted 17 field(s)`);
#  - a template does **not** re-sync when the class changes, and steps 7–9 are that, on camera:
#    the daily template starts with no class, gains `fileClass: Activity` by hand, and stays at
#    that single key when `attendance` is added to Activity. Running the insert on it again takes
#    it to `fileClass, attendance, branch, icon, color, starts, doors`;
#  - the four Activity notes already written — *Signing — Blake & Mortimer*, *Reading group*,
#    *Library book sale*, *Film club — Dune* — do not gain `attendance`, and the class-wide pass
#    from take 030c offers exactly those four (`4 note(s) are missing 4 field(s) in all`). That
#    is step 10, and the reason 030c was recorded first;
#  - the four days under `Daily/2028/` carry no frontmatter and no class. They are what a day
#    looked like before this take, and they stay that way — a template only types what comes
#    after it.
#
# **Templater is named, not filmed** (step 11). It is not installed in this vault, and installing
# a community plugin on camera costs the three steps take 019 spent on Maps. The take stays on
# the core plugin everyone already has, and says in one line what the other one adds — a class or
# a value computed as the note is created.
title: "Fileclass — New notes that arrive already typed"
description: "Put the class in a template, and every note born from it starts complete."
doc: "schema/#creating-notes-with-a-template-templater--templates" # deep link used in the description
tags: "templates, templater, new notes, workflow"
vault_name: "Demo"
plugin: true
settings:
  classFilesPath: "Classes/"
  fileClassAlias: "fileClass"
initial_pause: 1500
default_pause: 900

steps:
  - title: "Every note so far was typed after it was written — a template types it before"
    pause: 2600
  - title: "This template is two headings and nothing else: write fileClass Book into its frontmatter"
    pause: 2600
  - title: "Then insert its missing fields, once — the whole class lands in the template, empty"
    pause: 2700
  - title: "Point Obsidian's Templates plugin at the folder that holds it"
    pause: 2400
  - title: "New note, insert the template, and it arrives with its class and every field"
    pause: 2600
  - title: "Nothing left to do but the values, in the panel you already know"
    pause: 2500
  - title: "Do the same for your days: the daily template has no class — write fileClass Activity into it"
    pause: 2700
  - title: "Now add a field to Activity, attendance, and look back at that template: it hasn't budged"
    pause: 2700
  - title: "A template is a copy, not a link — insert its missing fields again and the days written next carry attendance"
    pause: 2800
  - title: "The four activities already written don't gain it — insert into them one at a time, or across the class at once"
    pause: 2800
  - title: "Templater goes further still: it can work out the class, or a value, as the note is created"
    pause: 2600
  - title: "A class is a promise — a template is that promise kept from the first line"
    pause: 2600
