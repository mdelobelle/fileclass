name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Lint (Obsidian plugin rules)
        run: npm run lint:obsidian

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # `main.js` is committed so the plugin installs straight from GitHub, and `.gitattributes`
      # keeps git from merging two builds together — which means a merge can leave a bundle that
      # predates the sources it ships with. This is the step that catches that.
      - name: Bundle matches the sources
        run: |
          if ! git diff --exit-code -- main.js; then
            echo "::error file=main.js::main.js does not match a fresh build. Run 'npm run build' and commit it."
            exit 1
          fi
