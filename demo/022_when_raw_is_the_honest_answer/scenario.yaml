# Narration for take 022 — see ../SCENARIO.md for the format.
# Last of arc 4. Starts where 021 ended: Book carries `editions`, Dune keeps the two it
# was left with (the paperback first, because step 9 of that take moved it there), Tolkien
# has the single 1991 paperback its own note describes, and Books.base counts them.
#
# Adds two raw fields to Album and closes the field types. The two are NOT the same field
# in two notations — that framing was wrong and the code has changed under it:
#
#   Album.credits   YAML   stores the parsed structure → a base reaches inside it
#   Album.import    JSON   stores the text, as a block scalar → kept verbatim, opaque
#
# Facts the script leans on, all measured in the app before scripting:
#  - a JSON field stores its text and Obsidian writes it as a block scalar: `import: |-`
#    with the JSON indented under it. A block already in a file survives a write to
#    another key untouched, and the cache gives the exact text back. So step 12 can claim
#    "kept as it came" and show it on disk;
#  - a YAML field stores real frontmatter keys, so `note.credits.producer` in a formula
#    gives Teo Macero and `note.credits.personnel.length` gives 3, while the dotted column
#    `credits.producer` renders EMPTY — the same rule as groups. Albums.base ships those
#    formulas, so nothing films formula editing (#19);
#  - a JSON field in a base is a string: the `import` column shows the payload as text and
#    no formula reaches into it. That is the price of verbatim, and steps 12 and 14 name it;
#  - the parser answers while you type, naming the line, the column, and pointing a caret
#    at the spot;
#  - Escape asks instead of discarding — the raw editor was the last one without a guard;
#  - a declared raw field loses Obsidian's warning colour while its value stays raw on
#    screen, which for these two types is the honest answer;
#  - where a value can't be shown whole it reads `3 keys` / `5 items`, not `{…}`;
#  - the editor offers *Convert from YAML* whenever a JSON field's text reads as YAML, and
#    hides the offer as soon as it doesn't. Step 13 films exactly that mistake;
#  - incidental, visible from step 1: Kind of Blue's `length` shows `45m 44s` beside the
#    stored `PT45M44S`. No step names it, but it will be on screen.
#
# The credits to type, all real. Both are cued (`input:`), one press per box: they are
# punctuation-heavy blocks, and a take should not become a typing lesson.
#   Kind of Blue     producer: Teo Macero · engineer: Fred Plaut ·
#                    personnel: Miles Davis, John Coltrane, Bill Evans
#   A Love Supreme   producer: Bob Thiele · studio: Van Gelder Studio ·
#                    quartet: John Coltrane, McCoy Tyner, Jimmy Garrison, Elvin Jones
#
# The two shapes disagree on purpose, and that is the argument of the take: one credits its
# personnel, the other its quartet and its studio. Step 10 admits the price on screen — the
# `Personnel` column is full for one album and empty for the other, because nothing checks
# the inside of a raw value.
#
# Fourteen steps rather than thirteen: naming the field to create belongs in the subtitle
# (the operator reads it while recording, not this header), and "kept as it came" and "one
# button converts it" are two gestures, so they are two steps.
#
# The `import` payload is invented, and reads as what a record shop's export would give:
# a release id, a pressing, a matrix number. It is the one thing in this take that isn't a
# fact about the records, which is fine — it stands for "something another tool produced".
#
# The vault opens on Kind of Blue, the note the take works on.
title: "Fileclass — When raw is the honest answer"
description: "JSON and YAML: structure with no shape worth declaring."
doc: "fields/#structured-fields-json--yaml" # deep link used in the description
tags: "json, yaml, raw, frontmatter, bases"
vault_name: "Demo"
plugin: true
settings:
  classFilesPath: "Classes/"
  fileClassAlias: "fileClass"
initial_pause: 1500
default_pause: 900

steps:
  - title: "The credits of Kind of Blue: a producer, an engineer, the musicians — a shape that changes with every album"
    pause: 2300
  - title: "Declaring a class for that would pretend the shape is fixed. Sometimes raw is the honest answer"
    pause: 2200
  - title: "Give Album a credits field, of type YAML — what you type lands as real frontmatter keys"
    pause: 2200
  - title: "A box in monospace, and the parser answers while you type: it names the line and the column"
    input: "producer: Teo Macero\nengineer: Fred Plaut\npersonnel:\n  - Miles Davis\n  - John Coltrane\n  - Bill Evans"
    pause: 2400
  - title: "And Escape no longer throws the work away — it asks"
    pause: 2100
  - title: "Saved, the frontmatter holds real structure, not a string that looks like one"
    pause: 2100
  - title: "Obsidian shows it raw and read-only — but a field you declared isn't a warning"
    pause: 2200
  - title: "And where the value can't be shown whole, it says what it holds: three keys"
    pause: 2000
  - title: "A second album, credited its own way — nothing obliges two raw values to agree"
    input: "producer: Bob Thiele\nstudio: Van Gelder Studio\nquartet:\n  - John Coltrane\n  - McCoy Tyner\n  - Jimmy Garrison\n  - Elvin Jones"
    pause: 2400
  - title: "That structure is queryable: a base reaches inside it through a formula — never through a dotted column"
    pause: 2600
  - title: "Now the other type: give Album an import field, of type JSON, for a payload another tool produced"
    input: "{\n  \"release\": 1052166,\n  \"pressing\": \"1959 six-eye\",\n  \"matrix\": \"XSM 44903-1A\"\n}"
    pause: 2500
  - title: "Saved, it is kept exactly as it came: a block of its own in the frontmatter, and a plain string in the base"
    pause: 2500
  - title: "Paste the wrong notation into it and the parser says so — and one button turns that YAML into JSON"
    input: "sides: 2\nmastering: Van Gelder"
    pause: 2500
  - title: "So: a known shape gets Object or ObjectList, a shape you want to query gets YAML, and bytes you want kept get JSON"
    pause: 2500
